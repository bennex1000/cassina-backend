<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cassina Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#0a0a0e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(25, 16, 34, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .radial-bg {
            background: radial-gradient(circle at 20% 30%, rgba(127, 19, 236, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(45, 10, 80, 0.2) 0%, transparent 40%);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col font-display">
    <!-- Top Navigation -->
    <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-white/10 px-6 md:px-10 py-4 w-full fixed top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
        <div class="flex items-center gap-3 text-primary">
            <div class="size-8 flex items-center justify-center bg-primary rounded-lg text-white">
                <span class="material-symbols-outlined text-2xl">layers</span>
            </div>
            <h2 class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight">Cassina</h2>
        </div>
        <div class="flex gap-4">
            <button
                class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-5 bg-transparent border border-slate-300 dark:border-white/10 text-slate-700 dark:text-slate-300 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
                <span class="truncate">Support</span>
            </button>
            <button
                class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
                <span class="truncate">Sign Up</span>
            </button>
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center relative overflow-hidden pt-20 px-4">
        <!-- Background Decorative Elements -->
        <div class="absolute inset-0 radial-bg pointer-events-none"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[120px] pointer-events-none">
        </div>
        <div
            class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-blue-900/10 rounded-full blur-[150px] pointer-events-none">
        </div>
        <!-- Login Container -->
        <div class="w-full max-w-[460px] glass-card rounded-2xl p-8 md:p-12 shadow-2xl relative z-10">
            <!-- Header Section -->
            <div class="text-center mb-10">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary/10 text-primary mb-6">
                    <span class="material-symbols-outlined text-4xl">admin_panel_settings</span>
                </div>
                <h1 class="text-slate-900 dark:text-white text-3xl font-bold tracking-tight mb-2">Cassina</h1>
                <p class="text-slate-500 dark:text-slate-400 text-base">Access the control suite.</p>
            </div>
            <!-- Login Form -->
            <form class="space-y-6" onsubmit="return false;">
                <!-- Email Field -->
                <div class="flex flex-col gap-2">
                    <label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Email Address</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                        <input
                            class="w-full h-14 pl-12 pr-4 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-base"
                            placeholder="name@company.com" type="email" />
                    </div>
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-slate-700 dark:text-slate-300 text-sm font-medium">Password</label>
                        <a class="text-primary text-xs font-semibold hover:underline" href="#">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                        <input
                            class="w-full h-14 pl-12 pr-12 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-base"
                            placeholder="••••••••" type="password" />
                        <button
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                            type="button">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Action Button -->
                <button
                    class="w-full h-14 mt-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
                <!-- Divider -->
                <div class="flex items-center gap-4 py-2">
                    <div class="h-px flex-1 bg-slate-200 dark:bg-white/10"></div>
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-widest">or continue with</span>
                    <div class="h-px flex-1 bg-slate-200 dark:bg-white/10"></div>
                </div>
                <!-- SSO Button -->
                <button
                    class="w-full h-12 flex items-center justify-center gap-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-slate-700 dark:text-slate-300 font-semibold hover:bg-slate-50 dark:hover:bg-white/10 transition-colors">
                    <span>Company SSO</span>
                </button>
            </form>
        </div>
    </main>
    <!-- Footer -->
    <footer class="py-8 px-6 text-center relative z-10">
        <p class="text-slate-500 dark:text-slate-500 text-xs font-medium tracking-wide">
            © 2024 CASSINA SYSTEMS • SECURITY INFRASTRUCTURE v4.2.0
        </p>
    </footer>
</body>

</html>
