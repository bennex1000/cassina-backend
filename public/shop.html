<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cassina - the Shop</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#F59E0B", // Gold/Amber for Shop
                        "accent-green": "#10B981", // Buy Button
                        "background-light": "#f8f8f5",
                        "background-dark": "#1a0b2e",
                        "card-bg": "#2d1b4d",
                        "shop-slot": "#3a1d4d",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .pixel-border {
            box-shadow: 0 -4px 0 0 #000, 0 4px 0 0 #000, -4px 0 0 0 #000, 4px 0 0 0 #000;
        }

        .pixel-border-sm {
            box-shadow: 0 -2px 0 0 #000, 0 2px 0 0 #000, -2px 0 0 0 #000, 2px 0 0 0 #000;
        }

        .dither-bg {
            background-image: radial-gradient(#ffffff11 1px, transparent 1px);
            background-size: 4px 4px;
        }

        body {
            min-height: max(100dvh, 600px);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-white selection:bg-primary/30">
    <div
        class="relative flex h-screen w-full max-w-[430px] mx-auto flex-col overflow-hidden bg-background-light dark:bg-background-dark border-x border-white/5">

        <!-- Header -->
        <header
            class="flex items-center justify-between p-4 pt-8 bg-background-dark/80 backdrop-blur-sm z-10 border-b-4 border-primary/20">
            <button onclick="window.location.href='cassina-game.html'"
                class="flex size-10 items-center justify-center bg-background-dark border-2 border-primary text-primary active:scale-95 transition-transform">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-xl font-bold tracking-widest text-primary uppercase">Merchant</h1>
            <div class="flex items-center gap-1 bg-black/40 px-2 py-1 border border-primary/30 rounded">
                <span class="text-primary text-xs font-bold">100</span>
                <span class="material-symbols-outlined text-primary text-sm">stars</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 pb-32 dither-bg">

            <!-- Featured Item / Daily Deal -->
            <section class="mb-6">
                <h3 class="text-xs font-bold tracking-[0.2em] text-primary/70 mb-3 uppercase">Daily Deal</h3>
                <div class="bg-gradient-to-br from-primary/20 to-purple-900/40 p-1 pixel-border">
                    <div class="bg-black/40 p-4 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div
                                class="size-16 bg-shop-slot border-2 border-primary flex items-center justify-center relative">
                                <span
                                    class="material-symbols-outlined text-4xl text-primary drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]">key</span>
                                <div
                                    class="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 pixel-border-sm">
                                    -50%</div>
                            </div>
                            <div>
                                <h4 class="font-bold text-white uppercase text-sm">Golden Key</h4>
                                <p class="text-[10px] text-white/50 mb-1">Guarantees Rare+ Item</p>
                                <div class="flex items-center gap-1">
                                    <span class="text-white/40 line-through text-[10px]">200</span>
                                    <span class="text-primary font-bold text-xs">100 Credits</span>
                                </div>
                            </div>
                        </div>
                        <button
                            class="bg-accent-green text-black font-bold py-2 px-4 text-xs uppercase pixel-border-sm hover:brightness-110 active:scale-95">
                            Buy
                        </button>
                    </div>
                </div>
            </section>

            <!-- Categories -->
            <section>
                <div class="flex gap-4 mb-4 overflow-x-auto pb-2 scrollbar-hide">
                    <button
                        class="text-primary font-bold text-xs uppercase border-b-2 border-primary px-2 pb-1 shrink-0">Resources</button>
                    <button class="text-white/40 font-bold text-xs uppercase px-2 pb-1 shrink-0">Boosts</button>
                    <button class="text-white/40 font-bold text-xs uppercase px-2 pb-1 shrink-0">Cosmetics</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <!-- Item Card 1 -->
                    <div
                        class="bg-card-bg p-3 pixel-border border-white/5 flex flex-col items-center text-center group hover:border-primary/30 transition-colors">
                        <div
                            class="size-12 bg-shop-slot rounded mb-2 flex items-center justify-center group-hover:scale-105 transition-transform">
                            <span class="material-symbols-outlined text-white/60">refresh</span>
                        </div>
                        <h4 class="text-xs font-bold text-white mb-1">Spin Token</h4>
                        <div class="mt-auto pt-2 w-full">
                            <button
                                class="w-full bg-white/5 hover:bg-white/10 text-primary border border-primary/30 font-bold py-1.5 text-[10px] uppercase">
                                50 Credits
                            </button>
                        </div>
                    </div>
                    <!-- Item Card 2 -->
                    <div
                        class="bg-card-bg p-3 pixel-border border-white/5 flex flex-col items-center text-center group hover:border-primary/30 transition-colors">
                        <div
                            class="size-12 bg-shop-slot rounded mb-2 flex items-center justify-center group-hover:scale-105 transition-transform">
                            <span class="material-symbols-outlined text-white/60">bolt</span>
                        </div>
                        <h4 class="text-xs font-bold text-white mb-1">Speed Boost</h4>
                        <div class="mt-auto pt-2 w-full">
                            <button
                                class="w-full bg-white/5 hover:bg-white/10 text-primary border border-primary/30 font-bold py-1.5 text-[10px] uppercase">
                                75 Credits
                            </button>
                        </div>
                    </div>
                    <!-- Item Card 3 -->
                    <div
                        class="bg-card-bg p-3 pixel-border border-white/5 flex flex-col items-center text-center group hover:border-primary/30 transition-colors">
                        <div
                            class="size-12 bg-shop-slot rounded mb-2 flex items-center justify-center group-hover:scale-105 transition-transform">
                            <img src="magnet.png"
                                class="size-6 opacity-60 grayscale group-hover:grayscale-0 group-hover:opacity-100 transition-all">
                        </div>
                        <h4 class="text-xs font-bold text-white mb-1">Magnet Lvl.1</h4>
                        <div class="mt-auto pt-2 w-full">
                            <button
                                class="w-full bg-white/5 hover:bg-white/10 text-primary border border-primary/30 font-bold py-1.5 text-[10px] uppercase">
                                300 Credits
                            </button>
                        </div>
                    </div>
                    <!-- Item Card 4 -->
                    <div
                        class="bg-card-bg p-3 pixel-border border-white/5 flex flex-col items-center text-center group hover:border-primary/30 transition-colors">
                        <div
                            class="size-12 bg-shop-slot rounded mb-2 flex items-center justify-center group-hover:scale-105 transition-transform">
                            <img src="clover.png"
                                class="size-6 opacity-60 grayscale group-hover:grayscale-0 group-hover:opacity-100 transition-all">
                        </div>
                        <h4 class="text-xs font-bold text-white mb-1">Luck Charm</h4>
                        <div class="mt-auto pt-2 w-full">
                            <button
                                class="w-full bg-white/5 hover:bg-white/10 text-primary border border-primary/30 font-bold py-1.5 text-[10px] uppercase">
                                500 Credits
                            </button>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Nav -->
        <nav
            class="absolute bottom-0 left-0 w-full bg-background-dark/95 backdrop-blur-md border-t-2 border-primary/30 px-6 py-4 flex items-center justify-between z-20">
            <button onclick="window.location.href='cassina-game.html'" class="flex flex-col items-center gap-1 group">
                <span class="material-symbols-outlined text-white/40 group-hover:text-white">home</span>
                <span class="text-[9px] uppercase tracking-tighter text-white/40">Home</span>
            </button>
            <button onclick="window.location.href='vault.html'" class="flex flex-col items-center gap-1 group">
                <span class="material-symbols-outlined text-white/40 group-hover:text-white">inventory_2</span>
                <span class="text-[9px] uppercase tracking-tighter text-white/40">Vault</span>
            </button>
            <button class="flex flex-col items-center gap-1 group relative pb-1">
                <span class="material-symbols-outlined text-primary">shopping_cart</span>
                <span class="text-[9px] uppercase tracking-tighter text-primary font-bold">Shop</span>
                <div class="absolute -bottom-4 w-8 h-1 bg-primary"></div>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 group">
                <span class="material-symbols-outlined text-white/40 group-hover:text-white">person</span>
                <span class="text-[9px] uppercase tracking-tighter text-white/40">Profile</span>
            </button>
        </nav>
        <div class="h-6 bg-background-dark w-full shrink-0"></div>

    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        const USER_ID = localStorage.getItem('cassina_user_id') || 40;

        // Placeholder for logic
        // Future: Fetch User Currency
        // Future: Handle Purchases
    </script>
</body>

</html>
